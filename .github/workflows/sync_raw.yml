name: Sync CERT Raw Data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout CyberIA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Clone mirror repositories
      - name: Clone CERT-BUND
        run: git clone --depth 1 https://github.com/9adidaa/certbund-intel-mirror.git temp_certbund

      - name: Clone CERT-FR
        run: git clone --depth 1 https://github.com/9adidaa/certfr-intel-mirror.git temp_certfr

      - name: Clone CERT-EU
        run: git clone --depth 1 https://github.com/9adidaa/certeu-intel-mirror.git temp_certeu

      # 3️⃣ Prepare clean raw structure
      - name: Ensure raw directories exist
        run: |
          mkdir -p data/raw/certbund
          mkdir -p data/raw/certfr
          mkdir -p data/raw/certeu

      # 4️⃣ Correct incremental sync (NO double nesting)

      - name: Sync CERT-BUND
        run: |
          rsync -a --delete temp_certbund/database/raw/certbund/ data/raw/certbund/

      - name: Sync CERT-FR
        run: |
          rsync -a --delete temp_certfr/database/raw/certfr_dump_root/ data/raw/certfr/

      - name: Sync CERT-EU
        run: |
          rsync -a --delete temp_certeu/database/raw/certeu/ data/raw/certeu/

      # 5️⃣ Cleanup temp folders
      - name: Cleanup temp folders
        run: rm -rf temp_certbund temp_certfr temp_certeu

      # 6️⃣ Commit only if changes exist
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing..."
            git add data/raw
            git commit -m "Daily CERT raw sync"
            git push origin HEAD
          else
            echo "No changes detected."
          fi