name: Sync CERT Raw Data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout CyberIA
      - name: Checkout CyberIA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Clone mirror repositories (shallow)
      - name: Clone CERT-BUND
        run: git clone --depth 1 https://github.com/9adidaa/certbund-intel-mirror.git temp_certbund

      - name: Clone CERT-FR
        run: git clone --depth 1 https://github.com/9adidaa/certfr-intel-mirror.git temp_certfr

      - name: Clone CERT-EU
        run: git clone --depth 1 https://github.com/9adidaa/certeu-intel-mirror.git temp_certeu

      # 3️⃣ Ensure raw folders exist
      - name: Prepare raw directories
        run: |
          mkdir -p data/raw/certbund
          mkdir -p data/raw/certfr
          mkdir -p data/raw/certeu

      # 4️⃣ Incremental sync using rsync
      - name: Sync CERT-BUND raw
        run: |
          rsync -a --delete temp_certbund/database/raw/ data/raw/certbund/

      - name: Sync CERT-FR raw
        run: |
          rsync -a --delete temp_certfr/database/raw/ data/raw/certfr/

      - name: Sync CERT-EU raw
        run: |
          rsync -a --delete temp_certeu/database/raw/ data/raw/certeu/

      # 5️⃣ Cleanup temp folders
      - name: Cleanup temp folders
        run: rm -rf temp_certbund temp_certfr temp_certeu

      # 6️⃣ Commit only if changes exist
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add data/raw
            git commit -m "Daily CERT raw sync"
            git push
          else
            echo "No changes detected"
          fi