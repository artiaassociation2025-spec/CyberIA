name: Sync CERT Raw Data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# 🔥 THIS IS WHAT WAS MISSING
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout with write token
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Debug branch info
      - name: Debug repo state
        run: |
          echo "Branch:"
          git branch
          echo "Last commit:"
          git log -1 --oneline

      # 3️⃣ Clone mirror repos
      - name: Clone CERT-BUND
        run: git clone --depth 1 https://github.com/9adidaa/certbund-intel-mirror.git temp_certbund

      - name: Clone CERT-FR
        run: git clone --depth 1 https://github.com/9adidaa/certfr-intel-mirror.git temp_certfr

      - name: Clone CERT-EU
        run: git clone --depth 1 https://github.com/9adidaa/certeu-intel-mirror.git temp_certeu

      # 4️⃣ Ensure directories exist
      - name: Prepare raw directories
        run: |
          mkdir -p data/raw/certbund
          mkdir -p data/raw/certfr
          mkdir -p data/raw/certeu

      # 5️⃣ Incremental sync
      - name: Sync CERT-BUND
        run: rsync -a --delete temp_certbund/database/raw/ data/raw/certbund/

      - name: Sync CERT-FR
        run: rsync -a --delete temp_certfr/database/raw/ data/raw/certfr/

      - name: Sync CERT-EU
        run: rsync -a --delete temp_certeu/database/raw/ data/raw/certeu/

      # 6️⃣ Cleanup
      - name: Cleanup
        run: rm -rf temp_certbund temp_certfr temp_certeu

      # 7️⃣ Commit & push only if changes exist
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing..."
            git add data/raw
            git commit -m "Daily CERT raw sync"
            git push origin HEAD
          else
            echo "No changes detected."
          fi