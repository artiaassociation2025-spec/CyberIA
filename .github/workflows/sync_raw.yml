name: Sync CERT Raw Data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CyberIA
        uses: actions/checkout@v4

      # Clone mirror repositories
      - name: Clone CERT-BUND
        run: git clone --depth 1 https://github.com/9adidaa/certbund-intel-mirror.git temp_certbund

      - name: Clone CERT-FR
        run: git clone --depth 1 https://github.com/9adidaa/certfr-intel-mirror.git temp_certfr

      - name: Clone CERT-EU
        run: git clone --depth 1 https://github.com/9adidaa/certeu-intel-mirror.git temp_certeu

      # Clean old raw directory
      - name: Reset raw directory
        run: |
          rm -rf data/raw
          mkdir -p data/raw

      # Copy full raw directories
      - name: Copy CERT-BUND raw
        run: cp -r temp_certbund/database/raw data/raw/certbund

      - name: Copy CERT-FR raw
        run: cp -r temp_certfr/database/raw data/raw/certfr

      - name: Copy CERT-EU raw
        run: cp -r temp_certeu/database/raw data/raw/certeu

      # Cleanup
      - name: Cleanup temp folders
        run: rm -rf temp_certbund temp_certfr temp_certeu

      # Commit changes if any
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/raw
          git commit -m "Daily CERT raw sync" || echo "No changes"
          git push