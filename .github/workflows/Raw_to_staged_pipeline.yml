name: Daily CVE Pipeline

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
  repository-projects: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required packages here (if needed)
          # pip install requests lzma
      
      - name: Run CVE Pipeline
        run: |
          cd scripts/Raw_to_Staged
          python run_all.py
        env:
          PYTHONUNBUFFERED: 1
      
      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "🔄 Daily CVE pipeline run - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
      
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: pipeline-logs
          path: data/logs/
          retention-days: 30

  # Optional: Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: failure()
    steps:
      - name: Notify failure
        run: |
          echo "❌ Daily CVE pipeline failed!"
          echo "Check the workflow run at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
